<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OSCE 計時">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>OSCE 考站計時器</title>
<meta name="theme-color" content="#eaf1ee">
<meta name="description" content="OSCE 考官用手機計時器：指針倒數、提醒轉橘、超時轉紅，還有咕咕醫師陪考。">
<meta property="og:title" content="OSCE 考站計時器">
<meta property="og:description" content="手機打開即用的 OSCE 考官計時器：指針倒數、提醒轉橘、超時轉紅，可切換學員並記錄用時。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  /* 版面概念：考站卡 — 上方站別與學員，中央指針錶面＋倒數，下方拇指可及的大按鈕；咕咕醫師可拖到任何角落 */
  :root{
    --bg:#eaf1ee; --bg-hi:#f7faf9; --surface:#ffffff; --ink:#1d2a2e; --mute:#6b7c80; --track:#dbe5e2; --line:#d3dedb;
    --accent:#2f8f7a; --accent-soft:#dcefe9; --start:#de5f3e; --hand:#1d2a2e;
    --warn:#c97a1c; --warn-soft:#fbeedc; --over:#d14343; --over-soft:#fbe7e5;
    --m-body:#8fb8aa; --m-wing:#6f9e90; --m-belly:#f5f1e8; --m-beak:#f0a24a;
    --shadow:0 1px 2px rgba(29,42,46,.06),0 6px 20px rgba(29,42,46,.06);
    --num:"Lexend",-apple-system,"Segoe UI",sans-serif;
    --text:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#111819; --bg-hi:#1a2427; --surface:#1b2528; --ink:#e8efed; --mute:#8fa1a3; --track:#2a3739; --line:#2c393b; --hand:#e8efed;
    --accent:#4fb79e; --accent-soft:#1d3530; --warn:#e9a14a; --warn-soft:#3a2c19;
    --over:#ff6b6b; --over-soft:#2d1a1a; --m-belly:#e9e4d8; --shadow:none; color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg:#111819; --bg-hi:#1a2427; --surface:#1b2528; --ink:#e8efed; --mute:#8fa1a3; --track:#2a3739; --line:#2c393b; --hand:#e8efed;
    --accent:#4fb79e; --accent-soft:#1d3530; --warn:#e9a14a; --warn-soft:#3a2c19;
    --over:#ff6b6b; --over-soft:#2d1a1a; --m-belly:#e9e4d8; --shadow:none; color-scheme:dark}
  /* 童話風格：固定白天的繪本色調（不隨深色模式） */
  html:root[data-look="fairy"]{
    --bg:#dceaf8; --bg-hi:#fdeef5; --surface:#fffdf8; --ink:#3b3355; --mute:#7c7598; --track:#ece5f5; --line:#ddd3ec;
    --accent:#56b19c; --accent-soft:#def3ec; --start:#ef7f73; --hand:#3b3355;
    --warn:#df9327; --warn-soft:#fdf0d9; --over:#e05566; --over-soft:#fde4ea;
    --m-body:#b7a3e2; --m-wing:#9a84d0; --m-belly:#fff5e9; --m-beak:#f6a94b;
    --shadow:0 2px 0 rgba(59,51,85,.06),0 10px 24px rgba(91,72,140,.10);
    --num:"Fredoka","Lexend",-apple-system,sans-serif; color-scheme:light}

  html,body{height:100%}
  body{margin:0;background:var(--bg);background-image:radial-gradient(130% 70% at 50% 0%,var(--bg-hi),transparent 70%);background-attachment:fixed;
       color:var(--ink);font-family:var(--text);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
       user-select:none;-webkit-user-select:none;transition:background-color .6s ease;overflow-x:hidden}
  body.over{background-color:var(--over-soft)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* 童話背景：雲朵與星星 */
  .deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;display:none}
  [data-look="fairy"] .deco{display:block}
  .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;filter:blur(.3px)}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud.c1{width:120px;height:34px;left:-20px;bottom:20%;animation:drift 38s linear infinite}
  .cloud.c1::before{width:52px;height:52px;left:20px;top:-26px}.cloud.c1::after{width:40px;height:40px;left:62px;top:-16px}
  .cloud.c2{width:90px;height:26px;right:-10px;top:30%;opacity:.7;animation:drift 46s linear infinite reverse}
  .cloud.c2::before{width:40px;height:40px;left:14px;top:-20px}.cloud.c2::after{width:30px;height:30px;left:46px;top:-12px}
  .star{position:absolute;width:14px;height:14px;color:#f6c86a;animation:twinkle 3.2s ease-in-out infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(40px)}}
  @keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}

  .app{position:relative;z-index:1;min-height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
       padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  /* 站別列 */
  .top{display:flex;align-items:center;gap:6px}
  .station{font-family:var(--num);font-weight:600;font-size:18px;color:var(--accent);background:var(--accent-soft);
           padding:5px 12px;border-radius:999px;white-space:nowrap}
  .topic{flex:1;min-width:0;font-size:23px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:4px}
  .icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;flex:none}
  .icon-btn:active{background:var(--track)}

  /* 學員 */
  .student{display:flex;align-items:center;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:6px}
  .student .nav{width:48px;height:48px;border:0;border-radius:14px;background:transparent;color:var(--mute);display:grid;place-items:center}
  .student .nav:active{background:var(--track)}
  .student .who{flex:1;text-align:center;min-width:0}
  .student .who b{display:block;font-size:30px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .student .who small{font-family:var(--num);font-size:15px;color:var(--mute);letter-spacing:.04em}

  /* 錶面 */
  .stage{flex:1;display:grid;place-items:center;padding:4px 0}
  .ring{--size:min(92vw,calc(100dvh - 376px),560px);width:var(--size);height:var(--size);max-width:100%;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .ring circle{fill:none;stroke-width:10}
  .ring .face{fill:var(--surface);stroke:var(--line);stroke-width:1}
  [data-look="fairy"] .ring .face{stroke:var(--line);stroke-width:2;stroke-dasharray:1 4;stroke-linecap:round}
  .ring .trk{stroke:var(--track)}
  .ring .zone{stroke:var(--warn);stroke-width:3;opacity:.7;transition:opacity .4s}
  body.warn .zone,body.over .zone{opacity:0}
  .ring .arc{stroke:var(--accent);stroke-linecap:round;transition:stroke .5s}
  .ring .ticks line{stroke:var(--line);stroke-width:2;stroke-linecap:round}
  .ring .ticks line.major{stroke:var(--mute);stroke-width:2.4}
  .hand line{stroke:var(--hand);stroke-width:2.6;stroke-linecap:round}
  .hand .hub{fill:var(--hand)}
  .hand .hub-in{fill:var(--surface)}
  .hand .tip{fill:var(--accent);transition:fill .5s}
  .hand .tip-star{fill:#f6c25c;display:none}
  [data-look="fairy"] .hand .tip{display:none}
  [data-look="fairy"] .hand .tip-star{display:block}
  body.warn .hand .tip{fill:var(--warn)} body.over .hand .tip{fill:var(--over)}
  .no-hand .hand{display:none}

  .ring .center{position:absolute;inset:0;pointer-events:none}
  .status{position:absolute;left:50%;top:15%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);padding:2px 10px;border-radius:999px;
          font-size:clamp(16px,calc(var(--size)*.055),24px);font-weight:600;color:var(--mute);letter-spacing:.12em;transition:color .5s}
  .clock{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);white-space:nowrap;background:var(--surface);
         padding:.06em .22em;border-radius:.35em;font-family:var(--num);font-weight:600;
         font-size:calc(var(--size)*.2);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;transition:color .5s}
  .no-hand .status{top:24%}
  .no-hand .clock{top:50%;font-size:calc(var(--size)*.27)}
  .sub{position:absolute;left:50%;top:69%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);padding:2px 10px;border-radius:999px;
       font-family:var(--num);font-size:clamp(14px,calc(var(--size)*.042),19px);color:var(--mute)}
  .no-hand .sub{top:66%}
  body.over .hand{opacity:0;transition:opacity .4s}
  body.warn .arc{stroke:var(--warn)} body.warn .status,body.warn .clock{color:var(--warn)}
  body.over .arc{stroke:var(--over)} body.over .status,body.over .clock{color:var(--over)}
  body.over .clock{font-size:calc(var(--size)*.17);animation:breathe 2s ease-in-out infinite}
  body.over.no-hand .clock{font-size:calc(var(--size)*.225)}
  body.paused .clock{opacity:.55}
  @keyframes breathe{50%{opacity:.45}}

  /* 控制鍵 */
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .primary{grid-column:1/-1;height:80px;border:0;border-radius:24px;font-size:28px;font-weight:700;letter-spacing:.24em;
           display:flex;align-items:center;justify-content:center;gap:12px;
           background:var(--start);color:#fff;box-shadow:var(--shadow);transition:background-color .3s,transform .08s}
  .primary.is-pause{background:var(--warn-soft);color:var(--warn);box-shadow:none}
  .primary:active{transform:scale(.985)}
  .ghost{height:58px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:21px;font-weight:600;color:var(--ink);
         display:flex;align-items:center;justify-content:center;gap:8px}
  .ghost svg,.primary svg{flex:none}
  .ghost:active{background:var(--track)}
  [data-look="fairy"] .primary,[data-look="fairy"] .ghost,[data-look="fairy"] .student{border-radius:999px}

  .credit{margin:0;text-align:center;font-size:12px;line-height:1.5;color:var(--mute);letter-spacing:.02em}
  .credit .ver{font-family:var(--num);font-variant-numeric:tabular-nums}

  /* 咕咕醫師 */
  .mascot{position:fixed;z-index:5;width:86px;touch-action:none;cursor:grab;left:0;top:0;will-change:transform}
  .mascot.dragging{cursor:grabbing}
  .mascot svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
  .mascot .bob{transform-origin:60px 120px;animation:bob 3s ease-in-out infinite}
  body.running .mascot .bob{animation-duration:1.4s}
  .mascot .lids{transform-origin:60px 60px;transform:scaleY(0);animation:blink 4.5s infinite}
  .mascot .wing-l{transform-origin:24px 80px}.mascot .wing-r{transform-origin:96px 80px}
  body.over .mascot .wing-l{animation:flapL .5s ease-in-out infinite}
  body.over .mascot .wing-r{animation:flapR .5s ease-in-out infinite}
  body.warn .mascot .sweat{opacity:1}
  .mascot .sweat{opacity:0;transition:opacity .3s}
  @keyframes bob{50%{transform:translateY(-4px)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
  @keyframes flapL{50%{transform:rotate(28deg)}}
  @keyframes flapR{50%{transform:rotate(-28deg)}}
  .bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;width:max-content;max-width:180px;
          background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:8px 12px;
          font-size:15px;font-weight:600;line-height:1.4;text-align:center;box-shadow:var(--shadow);pointer-events:none}
  .bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--surface)}

  /* 底部面板 */
  .scrim{position:fixed;inset:0;background:rgba(18,26,28,.38);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .panel{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;
         padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
         padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
         user-select:text;-webkit-user-select:text;display:flex;flex-direction:column;gap:14px}
  .panel h2{margin:0;font-size:20px;text-wrap:balance}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field > label,.lbl{font-size:14px;color:var(--mute)}
  .field input[type=text],.field input:not([type]),.field textarea{width:100%;font:inherit;font-size:18px;padding:11px 13px;border-radius:14px;
         border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
  .field textarea{min-height:110px;line-height:1.55;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:14px}
  .seg button{height:42px;border:0;border-radius:11px;background:transparent;font-size:16px;font-weight:600;color:var(--mute)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .check{display:flex;align-items:center;gap:10px;font-size:16px}
  .check input{width:22px;height:22px;accent-color:var(--accent)}
  .hint{margin:0;font-size:13px;color:var(--mute);line-height:1.6}
  .err{margin:0;font-size:14px;color:var(--over);font-weight:600}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .solid{height:54px;border:0;border-radius:18px;background:var(--accent);color:#fff;font-size:18px;font-weight:700}
  .solid.danger{background:var(--over)}
  .panel .ghost{height:54px;font-size:18px}
  .log{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
  .log-head{display:flex;justify-content:space-between;align-items:center}
  .log-head h3{margin:0;font-size:16px}
  .link{border:0;background:transparent;color:var(--mute);font-size:14px;padding:6px 8px;border-radius:10px}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-weight:500;color:var(--mute);font-size:13px}
  td.num{font-family:var(--num);font-variant-numeric:tabular-nums}
  .tag{font-size:12px;color:var(--over);background:var(--over-soft);padding:2px 7px;border-radius:999px;margin-left:6px}

  /* 分享 */
  .qr-card{display:flex;gap:16px;align-items:center;background:#ffffff;color:#1d2a2e;border-radius:18px;padding:14px;border:1.5px solid var(--line)}
  .qr{width:132px;height:132px;flex:none;display:grid;place-items:center}
  .qr svg{width:100%;height:100%}
  .qr-txt{min-width:0;display:flex;flex-direction:column;gap:4px}
  .qr-txt b{font-size:18px}
  .qr-txt code{font-family:var(--num);font-size:13px;word-break:break-all;color:#2f8f7a}
  .promo{width:100%;font:inherit;font-size:15px;line-height:1.6;padding:11px 13px;border-radius:14px;border:1.5px solid var(--line);
         background:var(--bg);color:var(--ink);min-height:120px;resize:vertical}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
         background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;z-index:20;max-width:calc(100% - 32px);text-align:center}

  @media (orientation:landscape) and (max-height:520px){
    .app{max-width:900px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto;column-gap:24px}
    .top,.student,.credit{grid-column:2}
    .stage{grid-column:1;grid-row:1/5}
    .ring{--size:min(42vw,80vh)}
    .controls{grid-column:2;align-self:end}
    .primary{height:64px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="deco" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <svg class="star" style="left:12%;top:16%" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.6 6.6L21 9.3l-5 4.4 1.5 6.8L12 17l-5.5 3.5L8 13.7 3 9.3l6.4-.7z"/></svg>
  <svg class="star" style="right:14%;top:9%;animation-delay:1.1s" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.6 6.6L21 9.3l-5 4.4 1.5 6.8L12 17l-5.5 3.5L8 13.7 3 9.3l6.4-.7z"/></svg>
  <svg class="star" style="left:6%;top:52%;width:10px;height:10px;animation-delay:2s" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.6 6.6L21 9.3l-5 4.4 1.5 6.8L12 17l-5.5 3.5L8 13.7 3 9.3l6.4-.7z"/></svg>
  <svg class="star" style="right:7%;top:60%;width:11px;height:11px;animation-delay:.6s" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.6 6.6L21 9.3l-5 4.4 1.5 6.8L12 17l-5.5 3.5L8 13.7 3 9.3l6.4-.7z"/></svg>
</div>

<div class="app">
  <header class="top">
    <span class="station" id="stationNo">第 3 站</span>
    <span class="topic" id="topic">腹部身體檢查</span>
    <button class="icon-btn" id="openShare" aria-label="分享計時器">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
    <button class="icon-btn" id="openSet" aria-label="考站設定">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="student" aria-label="目前學員">
    <button class="nav" id="prevStu" aria-label="上一位學員"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="who"><b id="stuName">學員A</b><small id="stuIdx">1 / 1</small></div>
    <button class="nav" id="nextStu" aria-label="下一位學員"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </section>

  <main class="stage">
    <div class="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="face" cx="100" cy="100" r="84"/>
        <circle class="trk" cx="100" cy="100" r="92"/>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  'use strict';
  var KEY='osce_examiner_timer_v1';
  var SITE='https://a77993111-creator.github.io/osce-timer/';
  var $=function(id){return document.getElementById(id);};
  var C=2*Math.PI*92;
  var TIPS=['先自我介紹，確認病人身分','檢查前記得洗手','說明要做什麼並徵求同意','注意病人隱私與保暖','深呼吸，你可以的！','結束前做個重點總結','檢查完記得幫病人整理衣物'];

  /* ---------- 設定 ---------- */
  var cfg={no:'3',topic:'腹部身體檢查',min:8,warn:1,list:['學員A','學員B','學員C'],idx:0,log:[],look:'clean',hand:true,mascot:true,notify:false,mpos:null};
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)for(var k in s)cfg[k]=s[k];}catch(e){}
  if(!Array.isArray(cfg.list)||!cfg.list.length)cfg.list=['學員A'];
  if(!Array.isArray(cfg.log))cfg.log=[];
  if(cfg.idx>=cfg.list.length)cfg.idx=0;
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(cfg));}catch(e){}}

  function applyLook(){
    document.documentElement.setAttribute('data-look',cfg.look==='fairy'?'fairy':'clean');
    document.body.classList.toggle('no-hand',!cfg.hand);
    $('mascot').hidden=!cfg.mascot;
  }

  /* ---------- 計時 ---------- */
  var total=0,remain=0,endAt=0,running=false,started=false,warned=false,overed=false,lastSec=null,endTimer=null;
  $('arc').style.strokeDasharray=C+' '+C;
  var ICON_PLAY='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4c0 .8.9 1.3 1.6.8l11-7.2c.6-.4.6-1.2 0-1.6l-11-7.2C7.9 3.5 7 4 7 4.8z"/></svg>';
  var ICON_PAUSE='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.4"/><rect x="14" y="4.5" width="4" height="15" rx="1.4"/></svg>';

  function drawDial(){
    var g=$('ticks'),n=Math.max(1,Math.round(cfg.min)),per=n>20?5:1,html='';
    for(var i=0;i<n;i+=per){var a=i/n*2*Math.PI,major=i%5===0,r1=major?74:76.5,r2=80;
      html+='<line class="'+(major?'major':'')+'" x1="'+(100+r1*Math.cos(a)).toFixed(2)+'" y1="'+(100+r1*Math.sin(a)).toFixed(2)+'" x2="'+(100+r2*Math.cos(a)).toFixed(2)+'" y2="'+(100+r2*Math.sin(a)).toFixed(2)+'"/>';}
    g.innerHTML=html;
    var wf=Math.min(1,Math.max(0,cfg.warn/cfg.min)),z=$('zone');
    z.style.strokeDasharray=(C*wf)+' '+C;z.style.strokeDashoffset=-C*(1-wf);
  }
  function curRemain(){return running?endAt-Date.now():remain;}

  /* 每一幀：指針平滑轉動、圓環跟著縮短 */
  function frame(){
    var r=curRemain(),e=total>0?Math.min(1,Math.max(0,(total-r)/total)):0,over=started&&r<=0;
    $('hand').setAttribute('transform','rotate('+(e*360).toFixed(2)+' 100 100)');
    $('arc').style.strokeDashoffset=over?0:-C*e;
    requestAnimationFrame(frame);
  }

  function resetTimer(){
    total=Math.round(cfg.min*60000);remain=total;running=started=warned=overed=false;lastSec=null;clearTimeout(endTimer);
    drawDial();render();
  }
  function fmt(ms){
    var neg=ms<0,t=neg?Math.floor(-ms/1000):Math.ceil(ms/1000);
    return (neg?'+':'')+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  }
  function render(){
    var warnMs=cfg.warn*60000,over=started&&remain<=0,warn=started&&!over&&warnMs>0&&remain<=warnMs;
    var b=document.body.classList;
    b.toggle('over',over);b.toggle('warn',warn);b.toggle('paused',started&&!running);b.toggle('running',running);
    $('clock').textContent=fmt(over?remain:Math.max(remain,0));
    $('status').textContent=over?'時間到':!started?'準備開始':!running?'已暫停':warn?'即將結束':'進行中';
    $('sub').textContent=over?'已超時':'考試 '+cfg.min+' 分鐘';
    var mb=$('mainBtn'),lbl=running?'暫停':started?'繼續':'開始';
    if(mb.dataset.l!==lbl){mb.dataset.l=lbl;mb.innerHTML=(running?ICON_PAUSE:ICON_PLAY)+'<span>'+lbl+'</span>';}
    mb.classList.toggle('is-pause',running);
    $('stationNo').textContent='第 '+cfg.no+' 站';
    $('topic').textContent=cfg.topic;
    $('stuName').textContent=cfg.list[cfg.idx]||'未設定學員';
    $('stuIdx').textContent=(cfg.idx+1)+' / '+cfg.list.length;
    document.title=(started?fmt(remain)+' · ':'')+'OSCE 考站計時器';
  }
  function tick(){
    if(running){
      remain=endAt-Date.now();
      var warnMs=cfg.warn*60000;
      if(!warned&&warnMs>0&&remain<=warnMs&&remain>0){warned=true;cue('warn');}
      if(!overed&&remain<=0){overed=true;cue('over');}
      var sec=Math.ceil(remain/1000);
      if(remain>0&&sec<=5&&sec!==lastSec){lastSec=sec;beep(880,.08,0,.3);}
    }
    render();
  }
  function toggle(){
    unlockAudio();
    if(running){remain=endAt-Date.now();running=false;clearTimeout(endTimer);}
    else{
      endAt=Date.now()+remain;running=started=true;keepAwake();if(remain===total)beep(988,.22);
      clearTimeout(endTimer);if(remain>0)endTimer=setTimeout(tick,remain+30);
      if(remain===total)say('開始囉，加油！');
    }
    render();
  }
  function recordIfUsed(){
    if(!started)return;
    var used=total-curRemain(),d=new Date();
    cfg.log.unshift({t:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),
      no:cfg.no,s:cfg.list[cfg.idx]||'',used:Math.round(used/1000),ot:used>total});
    cfg.log=cfg.log.slice(0,200);persist();
  }

  /* ---------- 頁內確認 ---------- */
  var askCb=null;
  function ask(msg,yesLabel,cb){
    if(!started){cb();return;}
    $('askMsg').textContent=msg;$('askYes').textContent=yesLabel||'確定';askCb=cb;$('askScrim').hidden=false;$('askYes').focus();
  }
  $('askNo').addEventListener('click',function(){$('askScrim').hidden=true;askCb=null;});
  $('askYes').addEventListener('click',function(){$('askScrim').hidden=true;var f=askCb;askCb=null;if(f)f();});
  $('askScrim').addEventListener('click',function(e){if(e.target===this){this.hidden=true;askCb=null;}});

  /* ---------- 聲音／震動／通知／螢幕常亮 ---------- */
  var ac=null;
  function unlockAudio(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!ac)ac=new A();if(ac.state==='suspended')ac.resume();
    var bf=ac.createBuffer(1,1,22050),src=ac.createBufferSource();src.buffer=bf;src.connect(ac.destination);src.start(0);}catch(e){}}
  function beep(f,dur,when,vol){if(!ac)return;try{var t=ac.currentTime+(when||0),v=vol||.7,o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);
    g.gain.setValueAtTime(v,t+Math.max(dur-.05,.03));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
  function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
  var swReg=null;
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(function(r){swReg=r;}).catch(function(){});}catch(e){}
  function notify(title,body){
    if(!cfg.notify)return;
    try{
      if(!('Notification' in window)||Notification.permission!=='granted')return;
      var opt={body:body,tag:'osce-timer',renotify:true,vibrate:[400,150,400]};
      if(swReg&&swReg.showNotification)swReg.showNotification(title,opt);else new Notification(title,opt);
    }catch(e){}
  }
  function cue(type){
    var who='第 '+cfg.no+' 站 · '+(cfg.list[cfg.idx]||'');
    if(type==='warn'){[0,.3].forEach(function(w){beep(1175,.18,w);});vibrate([200,100,200]);say('剩 '+cfg.warn+' 分鐘囉！');notify('剩 '+cfg.warn+' 分鐘',who);}
    if(type==='over'){[0,.8,1.6].forEach(function(w){beep(784,.6,w);});vibrate([600,200,600,200,600]);say('時間到囉！');notify('時間到',who+' 已到考試時間');}
  }
  var wake=null;
  function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&!wake)
    navigator.wakeLock.request('screen').then(function(l){wake=l;l.addEventListener('release',function(){wake=null;});}).catch(function(){});}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){if(running)keepAwake();if(ac&&ac.state==='suspended')ac.resume();tick();}});

  function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},1800);}

  /* ---------- 咕咕醫師：點一下說話、拖曳移動 ---------- */
  var M=$('mascot'),bub=$('bubble'),pos={x:0,y:0};
  function say(t){if(!cfg.mascot)return;bub.textContent=t;bub.hidden=false;clearTimeout(say.h);say.h=setTimeout(function(){bub.hidden=true;},3200);}
  function clampPos(){
    var w=M.offsetWidth||86,h=M.offsetHeight||94,vw=window.innerWidth,vh=window.innerHeight;
    pos.x=Math.min(Math.max(4,pos.x),vw-w-4);pos.y=Math.min(Math.max(40,pos.y),vh-h-4);
    M.style.transform='translate('+pos.x+'px,'+pos.y+'px)';
  }
  function placeMascot(){
    var vw=window.innerWidth,vh=window.innerHeight;
    if(cfg.mpos){pos.x=cfg.mpos.x*vw;pos.y=cfg.mpos.y*vh;}else{pos.x=vw-98;pos.y=vh-330;}
    clampPos();
  }
  var drag=null;
  M.addEventListener('pointerdown',function(e){drag={sx:e.clientX,sy:e.clientY,ox:pos.x,oy:pos.y,moved:false};M.setPointerCapture(e.pointerId);});
  M.addEventListener('pointermove',function(e){
    if(!drag)return;var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>6){drag.moved=true;M.classList.add('dragging');}
    if(drag.moved){pos.x=drag.ox+dx;pos.y=drag.oy+dy;clampPos();}
  });
  function endDrag(){
    if(!drag)return;
    if(drag.moved){cfg.mpos={x:pos.x/window.innerWidth,y:pos.y/window.innerHeight};persist();}
    else say(TIPS[Math.floor(Math.random()*TIPS.length)]);
    drag=null;M.classList.remove('dragging');
  }
  M.addEventListener('pointerup',endDrag);M.addEventListener('pointercancel',endDrag);
  M.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();say(TIPS[Math.floor(Math.random()*TIPS.length)]);}});
  window.addEventListener('resize',placeMascot);

  /* ---------- 學員切換 ---------- */
  function goStudent(step){
    ask('目前學員已開始計時，要換下一位嗎？用時會記錄下來。','換學員',function(){
      recordIfUsed();cfg.idx=(cfg.idx+step+cfg.list.length)%cfg.list.length;persist();resetTimer();
      toast('現在是：'+cfg.list[cfg.idx]);say('下一位是 '+cfg.list[cfg.idx]);
    });
  }

  /* ---------- 設定 ---------- */
  var draftLook=cfg.look;
  function paintSeg(){[].forEach.call($('lookSeg').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.v===draftLook));});}
  $('lookSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;draftLook=b.dataset.v;paintSeg();});
  function openSet(){
    $('fNo').value=cfg.no;$('fTopic').value=cfg.topic;$('fMin').value=cfg.min;$('fWarn').value=cfg.warn;
    $('fList').value=cfg.list.join('\n');$('fHand').checked=!!cfg.hand;$('fMascot').checked=!!cfg.mascot;$('fNotify').checked=!!cfg.notify;
    draftLook=cfg.look;paintSeg();$('setErr').hidden=true;renderLog();$('setScrim').hidden=false;
  }
  function closeSet(){$('setScrim').hidden=true;}
  function saveSet(){
    var min=parseFloat($('fMin').value),warn=parseFloat($('fWarn').value);
    var list=$('fList').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    if(!(min>0&&min<=120)){var e=$('setErr');e.textContent='考試時間請填 1 到 120 之間的分鐘數，例如 8。';e.hidden=false;return;}
    var wantNotify=$('fNotify').checked;
    var apply=function(){
      var cur=cfg.list[cfg.idx],changed=min!==cfg.min;
      cfg.no=$('fNo').value.trim()||cfg.no;cfg.topic=$('fTopic').value.trim()||cfg.topic;cfg.min=min;
      cfg.warn=warn>=0?warn:1;cfg.list=list.length?list:['學員A'];
      cfg.look=draftLook;cfg.hand=$('fHand').checked;cfg.mascot=$('fMascot').checked;cfg.notify=wantNotify;
      var keep=cfg.list.indexOf(cur);cfg.idx=keep>=0?keep:0;persist();closeSet();applyLook();placeMascot();
      if(changed)resetTimer();else{drawDial();render();}toast('已儲存');
    };
    if(wantNotify&&!cfg.notify){
      try{
        if(!('Notification' in window)){toast('這個瀏覽器不支援手機通知');wantNotify=false;}
        else Notification.requestPermission().then(function(p){if(p!=='granted'){cfg.notify=false;persist();toast('沒有取得通知權限，可到瀏覽器設定開啟');}});
      }catch(e){wantNotify=false;}
    }
    if(min!==cfg.min&&started){closeSet();ask('修改考試時間會重設目前的計時，要繼續嗎？','重設並儲存',apply);}else apply();
  }
  function renderLog(){
    var tb=$('logBody');tb.innerHTML='';
    if(!cfg.log.length){var r=tb.insertRow(),c=r.insertCell();c.colSpan=4;c.textContent='換學員時，上一位的用時會自動記在這裡。';c.style.color='var(--mute)';c.style.whiteSpace='normal';return;}
    cfg.log.forEach(function(x){
      var r=tb.insertRow();
      r.insertCell().textContent=x.t;r.cells[0].className='num';
      r.insertCell().textContent='第 '+x.no+' 站';
      r.insertCell().textContent=x.s;
      var c=r.insertCell();c.className='num';c.textContent=fmt(x.used*1000).replace('+','');
      if(x.ot){var s=document.createElement('span');s.className='tag';s.textContent='超時';c.appendChild(s);}
    });
  }

  /* ---------- 分享／宣傳 ---------- */
  var PROMO='【OSCE 考站計時器】考官手機打開就能用，不用安裝：\n• 指針倒數，剩 1 分鐘轉橘、時間到轉紅並響鈴\n• 一鍵切換學員，自動記錄每位用時\n• 咕咕醫師陪考，還有童話風格可選\n'+SITE;
  function openShare(){
    $('siteUrl').textContent=SITE;$('promo').value=PROMO;
    var box=$('qr');
    try{var q=qrcode(0,'M');q.addData(SITE);q.make();box.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});}
    catch(e){box.innerHTML='<span style="font-size:13px;color:#6b7c80;text-align:center">QR code 載入失敗，請直接分享下方網址</span>';}
    $('shareScrim').hidden=false;
  }
  function copyText(t,ok){
    try{navigator.clipboard.writeText(t).then(function(){toast(ok);},function(){selectPromo();});}catch(e){selectPromo();}
  }
  function selectPromo(){var p=$('promo');p.focus();p.select();toast('已選取文字，請按「拷貝」');}
  $('copyPromo').addEventListener('click',function(){copyText($('promo').value,'已複製宣傳文字');});
  $('nativeShare').addEventListener('click',function(){
    var data={title:'OSCE 考站計時器',text:$('promo').value.replace(SITE,'').trim(),url:SITE};
    try{if(navigator.share){navigator.share(data).catch(function(){});return;}}catch(e){}
    copyText($('promo').value,'這個瀏覽器不能直接分享，已改為複製文字');
  });
  $('closeShare').addEventListener('click',function(){$('shareScrim').hidden=true;});
  $('shareScrim').addEventListener('click',function(e){if(e.target===this)this.hidden=true;});

  /* ---------- 事件 ---------- */
  $('mainBtn').addEventListener('click',toggle);
  $('resetBtn').addEventListener('click',function(){ask('要重設這位學員的計時嗎？','重設',resetTimer);});
  $('nextBtn').addEventListener('click',function(){goStudent(1);});
  $('nextStu').addEventListener('click',function(){goStudent(1);});
  $('prevStu').addEventListener('click',function(){goStudent(-1);});
  $('openSet').addEventListener('click',openSet);
  $('openShare').addEventListener('click',openShare);
  $('cancelSet').addEventListener('click',closeSet);
  $('saveSet').addEventListener('click',saveSet);
  $('setScrim').addEventListener('click',function(e){if(e.target===this)closeSet();});
  $('clearLog').addEventListener('click',function(){cfg.log=[];persist();renderLog();toast('紀錄已清除');});

  applyLook();resetTimer();placeMascot();
  setInterval(tick,200);requestAnimationFrame(frame);
})();
</script>

</body>
</html>
